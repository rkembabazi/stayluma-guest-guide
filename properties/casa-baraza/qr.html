<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Printable Sign</title>
<meta name="description" content="A QR code for this guest guide, ready to print and post in the property." />
<link rel="stylesheet" href="../../assets/css/tokens.css" />
<link rel="stylesheet" href="../../assets/css/guide.css" />
<style>
  .qr-page {
    max-width: 480px;
    margin-inline: auto;
    padding: 32px 20px 60px;
    text-align: center;
  }
  .qr-page__canvas-wrap {
    margin: 24px auto;
    padding: 20px;
    background: #fff;
    border-radius: 20px;
    border: 1px solid var(--border);
    display: inline-block;
  }
  .qr-page__canvas-wrap canvas { display: block; max-width: 260px; width: 100%; height: auto; }
  .qr-page__url { font-size: 0.85rem; color: var(--ink-soft); word-break: break-all; margin-top: 8px; }
  .qr-page__actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
  .qr-page a.back { display: inline-block; margin-top: 28px; font-size: 0.85rem; color: var(--ink-soft); }
</style>
</head>
<body>

<div class="qr-page">
  <span class="eyebrow">Printable sign</span>
  <h1 id="qr-title" style="margin-top:8px; font-size:1.6rem;">Scan for the guest guide</h1>
  <p style="color:var(--ink-soft); margin-top:10px;">Print this and stick it somewhere guests will see it on arrival — by the door works well.</p>

  <div class="qr-page__canvas-wrap">
    <canvas id="qr-canvas" role="img" aria-label="QR code linking to the guest guide"></canvas>
  </div>
  <div class="qr-page__url" id="qr-url"></div>

  <div class="qr-page__actions">
    <button class="qr-card__btn" type="button" id="qr-download">Download high-res PNG</button>
  </div>

  <a class="back" href="index.html">&larr; Back to the guide</a>
</div>

<script src="../../assets/js/icons.js"></script>
<script src="data.js"></script>
<script src="../../assets/js/qrcode-lib.js"></script>
<script src="../../assets/js/qrcode.js"></script>
<script>
  (function () {
    const p = window.PROPERTY;
    const url = window.location.href.replace(/qr\.html.*$/, "");
    document.title = `Printable Sign — ${p.name}`;
    document.getElementById("qr-title").textContent = `Scan for ${p.name}`;
    document.getElementById("qr-url").textContent = url;

    const canvas = document.getElementById("qr-canvas");
    window.StayLumaQr.render(url, canvas, { cellSize: 16, marginModules: 4 });

    document.getElementById("qr-download").addEventListener("click", () => {
      const hiRes = document.createElement("canvas");
      window.StayLumaQr.render(url, hiRes, { cellSize: 32, marginModules: 4 });
      window.StayLumaQr.downloadPng(hiRes, `${p.name.replace(/\s+/g, "-").toLowerCase()}-qr.png`);
    });
  })();
</script>
</body>
</html>
